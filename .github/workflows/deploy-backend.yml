
name: Deploy Mockeefy Backend to AWS

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mockeefy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343607094872:role/Mockeefy-GitHubActions-Deploy-Role
          aws-region: ap-south-1

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-00b5747ae77e73b3a" \
            --document-name "AWS-RunShellScript" \
            --comment "Mockeefy backend deployment" \
            --parameters '{"commands":["set -eu","sudo -H -u ubuntu bash -lc '\''set -eu; cd /home/ubuntu/projectmockeefy; git fetch origin main; git merge --ff-only origin/main; cd server; npm ci --omit=dev; pm2 restart mockeefy-backend --update-env; pm2 save'\''"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-00b5747ae77e73b3a"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-00b5747ae77e73b3a" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
